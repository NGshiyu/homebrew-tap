# Homebrew Tap Workflow Ci Workflow Addition And Cask Update

## Action

Follow the ci-workflow-addition-and-cask-update workflow:
1. Modify or add workflow YAML files under .github/workflows/ (e.g., validate-cask.yml, update-cask.yml)
2. Edit or update a Cask formula file under Casks/ (e.g., keyden.rb)
3. Commit changes together to ensure CI and formula are in sync

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: .github/workflows/validate-cask.yml, .github/workflows/update-cask.yml, Casks/*.rb

